<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPA 运营工具</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f8fb;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f8fb;
        color: #374151;
      }
      .boot-mark {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        background: linear-gradient(135deg, #3b82f6, #6d5efc);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 25px;
        font-weight: 700;
        box-shadow: 0 6px 18px rgba(59, 130, 246, .25);
      }
      .boot-name { font-size: 16px; font-weight: 650; letter-spacing: .3px; }
      .boot-slogan {
        margin-top: 10px;
        font-size: 56px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #2563eb;
        text-shadow: 0 4px 20px rgba(37, 99, 235, .28);
        white-space: nowrap;
      }
      .boot-slogan span {
        display: inline-block;
        opacity: 0;
        animation: boot-pop .5s cubic-bezier(.34, 1.56, .64, 1) forwards;
      }
      .boot-slogan span:nth-child(1) { animation-delay: .10s; }
      .boot-slogan span:nth-child(2) { animation-delay: .22s; }
      .boot-slogan span:nth-child(3) { animation-delay: .34s; }
      .boot-slogan span:nth-child(4) { animation-delay: .46s; }
      .boot-slogan span:nth-child(5) { animation-delay: .58s; }
      .boot-slogan span:nth-child(6) { animation-delay: .70s; }
      .boot-slogan span:nth-child(7) { animation-delay: .82s; }
      @keyframes boot-pop {
        0% { opacity: 0; transform: translateY(14px) scale(.5) rotate(-12deg); }
        70% { transform: translateY(-3px) scale(1.12) rotate(3deg); }
        100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
      }
      .boot-tip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9aa5b5; }
      .boot-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #dbe6ff;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: boot-spin .8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-screen">
      <div class="boot-mark">R</div>
      <div class="boot-name">RPA 运营工具</div>
      <div class="boot-slogan" aria-label="牛马，起来干活">
        <span>牛</span><span>马</span><span>，</span><span>起</span><span>来</span><span>干</span><span>活</span>
      </div>
      <div class="boot-tip"><span class="boot-spinner"></span>正在加载界面…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
